<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a6eff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/png" href="./logo-sao-luiz.png" />
    <link rel="apple-touch-icon" href="./logo-sao-luiz.png" />
    <title>Editor de Artes — São Luiz</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Manrope, system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: max(1.25rem, env(safe-area-inset-top)) 1.25rem max(1.25rem, env(safe-area-inset-bottom));
        background:
          radial-gradient(circle at 50% 18%, rgba(26, 110, 255, 0.16), transparent 42%),
          linear-gradient(165deg, #f7f9fb 0%, #e9eef3 55%, #dde5ee 100%);
        color: #152033;
      }
      .card {
        width: min(22rem, 100%);
        padding: 1.6rem 1.35rem 1.35rem;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 18px 40px rgba(21, 32, 51, 0.12);
        text-align: center;
      }
      .logo-sao {
        width: min(7.5rem, 42vw);
        height: auto;
        display: block;
        margin: 0 auto 0.85rem;
      }
      .logo-elo {
        width: min(5.5rem, 34vw);
        height: auto;
        display: block;
        margin: 0.85rem auto 0;
      }
      h1 {
        margin: 0;
        font-size: 1.35rem;
        line-height: 1.2;
      }
      p {
        margin: 0.55rem 0 0;
        color: #5c6573;
        font-size: 0.92rem;
        line-height: 1.4;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 1.1rem;
        min-height: 2.85rem;
        padding: 0.7rem 1.15rem;
        border-radius: 10px;
        background: linear-gradient(165deg, #5ba3ff 0%, #1a6eff 55%, #0f5ae0 100%);
        color: #fff;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-decoration: none;
      }
      .brands {
        margin-top: 1rem;
        padding-top: 0.85rem;
        border-top: 1px solid rgba(21, 32, 51, 0.08);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo-sao" src="./logo-sao-luiz.png" alt="São Luiz Funerária" />
      <h1>Editor de Artes</h1>
      <p>Abrindo o app da São Luiz Funerária…</p>
      <a class="btn" id="open-app" href="./">Abrir agora</a>
      <div class="brands">
        <img class="logo-elo" src="./templates/elo-badge.png" alt="Elo Tecnologia" />
      </div>
    </main>
    <script>
      (function () {
        var base = new URL('./', window.location.href).href
        var open = document.getElementById('open-app')
        if (open) open.setAttribute('href', base)
        if (!/([?&])stay=1(?:&|$)/.test(window.location.search)) {
          window.setTimeout(function () {
            window.location.replace(base)
          }, 1600)
        }
      })()
    </script>
  </body>
</html>
